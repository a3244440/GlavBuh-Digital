<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1730">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Хифз за год</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;600;700;800;900&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a game app — desktop: nav rail | play column | stats rail; phone: top HUD + bottom tab bar.
   The path is a column of eight-pointed stars (rub el hizb), one per juz, grouped in six sections. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F2F4FA; --ink:#172040; --muted:#5D6790; --line:#DCE1EF;
  --accent:#12A88F; --accent-d:#0B7B68; --accent-t:#0B7B68; --on-accent:#FFFFFF;
  --gold:#F2B92E; --gold-d:#C88E0C; --gold-t:#9A6A00; --on-gold:#2B1D00;
  --coral:#F0644F; --coral-d:#C2412F;
  --lock:#E3E7F2; --lock-d:#C7CEE2;
  --mark-ok:#0E9C86; --mark-weak:#E2553F; --cell:#E6EAF4;
  --sec1:#47D6BB; --sec2:#F6C552; --sec3:#FF9784; --on-sec:#10183A;
  --shadow:0 1px 0 rgba(23,32,64,.04),0 8px 24px -12px rgba(23,32,64,.18);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Reem Kufi","Noto Kufi Arabic","Geeza Pro",serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1730; --surface:#172247; --surface-2:#1E2B57; --ink:#EEF1FA; --muted:#97A2C6; --line:#2A3766;
  --accent:#3FD0B5; --accent-d:#1E8F7A; --accent-t:#3FD0B5; --on-accent:#062A24;
  --gold:#F5C34F; --gold-d:#B98814; --gold-t:#F5C34F; --on-gold:#2B1D00;
  --coral:#FF7A66; --coral-d:#C24A38;
  --lock:#25335F; --lock-d:#18224A;
  --mark-ok:#25A88F; --mark-weak:#E85E50; --cell:#22305C;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1730; --surface:#172247; --surface-2:#1E2B57; --ink:#EEF1FA; --muted:#97A2C6; --line:#2A3766;
  --accent:#3FD0B5; --accent-d:#1E8F7A; --accent-t:#3FD0B5; --on-accent:#062A24;
  --gold:#F5C34F; --gold-d:#B98814; --gold-t:#F5C34F; --on-gold:#2B1D00;
  --coral:#FF7A66; --coral-d:#C24A38;
  --lock:#25335F; --lock-d:#18224A;
  --mark-ok:#25A88F; --mark-weak:#E85E50; --cell:#22305C;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);max-width:640px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.rail,.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .star{width:34px;height:34px;flex:none}
.logo .star .s-base{fill:var(--accent-d)} .logo .star .s-top{fill:var(--accent)}
.logo b{font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap}
.hudchips{display:flex;gap:6px}
.hc{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:15px;padding:6px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.hc svg{width:18px;height:18px}
.hc.fire{color:var(--coral)} .hc.xp{color:var(--gold-t)} .hc.lv{color:var(--accent-t)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tb{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:800;transition:transform 140ms var(--ease-out)}
.tb svg{width:26px;height:26px}
.tb:active{transform:scale(.94)}
.tb[aria-current="page"]{color:var(--accent-t);background:color-mix(in srgb,var(--accent) 14%,transparent)}

main{min-width:0;display:grid;gap:16px;align-content:start;padding-block:4px 24px}

@media (min-width:1080px){
  .app{max-width:1240px;grid-template-columns:220px minmax(0,1fr) 330px;gap:32px;padding-bottom:0}
  .topbar,.tabbar,.only-m{display:none!important}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-block:24px;align-self:start}
  .rail .logo{padding:0 10px 18px}
  .side{display:grid;gap:16px;align-content:start;position:sticky;top:0;align-self:start;padding-block:24px;max-height:100vh;overflow:auto;scrollbar-width:none}
  main{padding-block:24px 48px}
}
.rb{display:flex;align-items:center;gap:14px;background:none;border:2px solid transparent;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;color:var(--muted);text-align:left;letter-spacing:.02em;transition:background-color 140ms ease,transform 140ms var(--ease-out)}
.rb svg{width:26px;height:26px;flex:none}
.rb:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.rb:hover{background:var(--surface-2)}}
.rb[aria-current="page"]{color:var(--accent-t);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.rail hr{border:0;border-top:2px solid var(--line);margin:10px 8px}

/* language switch */
.topright{display:flex;align-items:center;gap:6px;min-width:0}
.lang{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface);border:2px solid var(--line);flex:none}
.lang button{border:0;background:none;border-radius:9px;padding:5px 8px;font-weight:900;font-size:12px;letter-spacing:.04em;color:var(--muted);transition:background-color 160ms ease,color 160ms ease,transform 120ms var(--ease-out)}
.lang button:active{transform:scale(.95)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.rail .logo{flex-wrap:wrap;row-gap:14px}
.rail .logo .lang{flex-basis:auto}
@media (max-width:460px){.topbar .logo b{display:none}.hc{padding:6px 8px;font-size:14px}.hudchips{gap:4px}}
@media (max-width:360px){.hc.lv{display:none}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sub{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.b3{--c:var(--accent);--cd:var(--accent-d);--t:var(--on-accent);border:0;border-radius:16px;background:var(--c);color:var(--t);font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:13px 20px;box-shadow:0 4px 0 var(--cd);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.b3:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.b3.gold{--c:var(--gold);--cd:var(--gold-d);--t:var(--on-gold)}
.b3.ghost{--c:var(--surface);--cd:var(--line);--t:var(--ink);border:2px solid var(--line)}
.b3.danger{--c:var(--surface);--cd:var(--coral-d);--t:var(--coral);border:2px solid var(--coral)}
.b3.sm{padding:9px 14px;font-size:12.5px;border-radius:12px}
.b3.wide{width:100%}
.bar{height:14px;border-radius:99px;background:var(--cell);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.35)}
.bar.thin{height:8px} .bar.thin i::after{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-t)}
.pill.go{background:var(--gold);color:var(--on-gold)}
.pill.warn{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* stars */
.star{display:block;overflow:visible}
.star .s-base{fill:var(--lock-d)} .star .s-top{fill:var(--lock)}
.gold-star .s-base{fill:var(--gold-d)} .gold-star .s-top{fill:var(--gold)}

/* ---------- side / HUD cards ---------- */
.lvcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.lvstar{width:64px;height:64px;position:relative;display:grid;place-items:center}
.lvstar .star{position:absolute;inset:0;width:100%;height:100%}
.lvstar b{position:relative;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--on-gold);margin-top:-3px}
.rank{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank .ar{font-size:17px;color:var(--gold-t);font-weight:500}
.xpline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center}
.st svg{width:26px;height:26px;grid-row:span 2}
.st b{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{font-size:12.5px;color:var(--muted);line-height:1.2}
.st.fire svg{color:var(--coral)} .st.page svg{color:var(--accent)} .st.juz svg{color:var(--gold)} .st.pace svg{color:var(--muted)}

/* quests */
.quests{display:grid;gap:14px}
.q{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.q .qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.q .qi svg{width:24px;height:24px}
.q.done .qi{background:var(--accent);color:var(--on-accent)}
.q .qt{font-weight:800;font-size:14.5px;line-height:1.25;margin-bottom:6px}
.q .qm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
.q .bar{height:10px}
.chest{margin-top:16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2)}
.chest svg{width:52px;height:52px}
.chest.open{background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.chest b{display:block;font-weight:900}
.chest span{font-size:13px;color:var(--muted)}

.demo{display:grid;gap:10px;justify-items:start;padding:16px;border-radius:var(--r);border:2px dashed var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.demo p{margin:0;font-size:14.5px}

/* ---------- path ---------- */
.section{display:grid;gap:26px;justify-items:center}
.banner{width:100%;background:var(--sec);color:var(--on-sec);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sec) 65%,#000 30%)}
.banner .eyebrow{color:color-mix(in srgb,var(--on-sec) 72%,transparent)}
.banner h3{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25;margin-top:2px}
.banner .ar{font-size:28px;font-weight:700;opacity:.8}
.banner .bp{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:900}
.banner .bp .bar{flex:1;height:10px;background:rgba(16,24,58,.16)}
.banner .bp .bar i{background:var(--on-sec)}
.banner .bp .bar i::after{display:none}
.nodes{display:grid;gap:24px;justify-items:center;padding-block:28px 22px;width:100%}
.nodewrap{position:relative;transform:translateX(calc(var(--o) * 60px))}
.nodewrap.is-cur{margin-top:44px}
.nodewrap.open{z-index:10}
.node{--n:var(--lock);--nd:var(--lock-d);--t:var(--muted);position:relative;width:86px;height:86px;border:0;background:none;padding:0;display:grid;place-items:center}
.node .star{position:absolute;inset:0;width:100%;height:100%}
.node .star .s-base{fill:var(--nd)} .node .star .s-top{fill:var(--n);transition:transform 120ms var(--ease-out)}
.node:active .star .s-top{transform:translateY(6px)}
.node .lab{position:relative;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--t);margin-top:-5px;transition:transform 120ms var(--ease-out)}
.node .lab svg{width:30px;height:30px;display:block}
.node:active .lab{transform:translateY(6px)}
.node.done{--n:var(--accent);--nd:var(--accent-d);--t:var(--on-accent)}
.node.cur{--n:var(--gold);--nd:var(--gold-d);--t:var(--on-gold)}
.node.part{--n:var(--surface-2);--nd:var(--line);--t:var(--ink)}
.node .ring{position:absolute;inset:-13px;width:calc(100% + 26px);height:calc(100% + 26px);transform:rotate(-90deg)}
.bubble{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--gold-t);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:12px;white-space:nowrap;animation:bob 2.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.pop{position:absolute;top:calc(100% + 16px);left:50%;z-index:6;width:min(300px,calc(100vw - 48px));background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;
  transform:translateX(-50%);transform-origin:top center;transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
@starting-style{.pop{opacity:0;transform:translateX(-50%) scale(.96)}}
.pop::before{content:"";position:absolute;left:50%;bottom:100%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translate(-50%,8px) rotate(45deg)}
.pop h4{margin:0;font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pop h4 .ar{font-size:18px;color:var(--gold-t);font-weight:500}
.pop p{margin:0;font-size:14px;color:var(--muted)}
.finish{display:grid;justify-items:center;gap:6px;text-align:center;padding:10px 0 20px}
.finish .star{width:96px;height:96px}
.finish .ar{font-size:44px;color:var(--gold-t);line-height:1.2}

/* ---------- today ---------- */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0;text-align:center}
.daynav .t b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px}
.daynav .t span{font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;flex:none;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 3px 0 var(--line);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.ib svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-block:4px 16px}
.tile{--c:var(--surface);--cd:var(--gold-d);border:2.5px solid var(--gold);background:var(--c);border-radius:18px;padding:14px 8px 12px;display:grid;justify-items:center;gap:2px;box-shadow:0 5px 0 var(--cd);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.tile:active{transform:translateY(5px);box-shadow:0 0 0 var(--cd)}
.tile small{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05}
.tile span{font-size:12px;font-weight:800;color:var(--gold-t)}
.tile.done{--c:var(--accent);--cd:var(--accent-d);border-color:var(--accent);color:var(--on-accent)}
.tile.done small,.tile.done span{color:var(--on-accent)}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
.slot:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.slot .ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--lock-d);display:grid;place-items:center;color:transparent;transition:background-color 160ms ease,border-color 160ms ease}
.slot .ck svg{width:18px;height:18px}
.slot .tm{font-size:12.5px;color:var(--muted);font-weight:800}
.slot .w{font-weight:800;font-size:15px}
.slot .xp{font-size:12px;font-weight:900;color:var(--gold-t)}
.slot.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:0 3px 0 var(--accent-d)}
.slot.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slot.on .xp{color:var(--accent-t)}
.tips{display:grid;gap:14px}
.tip{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.tip .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.tip .qi svg{width:22px;height:22px}
.tip b{display:block;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.sheet summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet summary::-webkit-details-marker{display:none}
.sheet summary .chev{width:36px;height:36px;flex:none;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;transition:transform 200ms var(--ease-out)}
.sheet[open] summary .chev{transform:rotate(180deg)}
.sheet summary .chev svg{width:18px;height:18px}

/* ---------- cloud sync (claude.ai account; absent on a plain website) ---------- */
let cloudRef=null,cloud="off",pushTimer=null,pushing=false,pushAgain=false;
function pushCloud(){if(!cloudRef)return;clearTimeout(pushTimer);pushTimer=setTimeout(flushCloud,700)}
async function flushCloud(){
  if(!cloudRef)return;if(pushing){pushAgain=true;return}
  pushing=true;cloud="saving";paintCloud();
  try{await cloudRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt||Date.now()});cloud="on"}
  catch(e){cloud=e&&e.code==="quota_exceeded"?"full":"error"}
  pushing=false;paintCloud();if(pushAgain){pushAgain=false;flushCloud()}
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    cloudRef=db.doc("data/users/"+id+"/hifz");cloud="saving";paintCloud();
    const snap=await cloudRef.get();
    const remote=snap.exists?snap.data():null;
    const rAt=remote&&remote.updatedAt||0,lAt=S.updatedAt||0;
    if(remote&&remote.json&&rAt>lAt){S=norm(JSON.parse(remote.json));saveLocal();cloud="on";render();toast(L("Данные загружены из облака","Деректер бұлттан жүктелді"));return}
    const hasData=learned()+Object.keys(S.days).length>0;
    if(hasData&&lAt>=rAt){if(!S.updatedAt)S.updatedAt=Date.now();await flushCloud()}else{cloud="on";paintCloud()}
  }catch(e){cloud="error";paintCloud()}
}

/* ---------- dates ---------- */
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addMonths(d,n){const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x}
function diff(a,b){return Math.round((parse(iso(b))-parse(iso(a)))/864e5)}
function fmt(d){return d.getDate()+" "+D().mon[d.getMonth()]}
function fmtY(d){return KK()?d.getFullYear()+" ж. "+fmt(d):fmt(d)+" "+d.getFullYear()}
const today=()=>parse(iso(new Date()));

/* ---------- derived ---------- */
function juzOf(p){let j=0;for(let i=0;i<30;i++)if(p>=JUZ_START[i])j=i;return j}
function juzRange(j){return [JUZ_START[j],j<29?JUZ_START[j+1]-1:TOTAL]}
function learned(){let n=0;for(const k in S.pages)if(S.pages[k]>0)n++;return n}
function weakList(){return Object.keys(S.pages).filter(k=>S.pages[k]===2).map(Number).sort((a,b)=>a-b)}
function nextPage(){for(let p=1;p<=TOTAL;p++)if(!S.pages[p])return p;return null}
function monthStart(i){return addMonths(parse(S.start),i)}
function monthIdx(d){const s=parse(S.start);if(d<s)return -1;for(let i=0;i<12;i++)if(d<monthStart(i+1))return i;return 12}
function monthDays(i){return diff(monthStart(i),monthStart(i+1))}
function rate(i){i=Math.max(0,Math.min(11,i));const m=PLAN_PAGES[i];return Math.max(1,Math.ceil((m[1]-m[0]+1)/monthDays(i)))}
function expected(d){const i=monthIdx(d);if(i<0)return 0;if(i>11)return TOTAL;const m=PLAN_PAGES[i];const el=diff(monthStart(i),d)+1;return m[0]-1+Math.round((m[1]-m[0]+1)*el/monthDays(i))}
function juzStat(j){const [a,b]=juzRange(j);let n=0,first=null,last=null;for(let p=a;p<=b;p++){if(S.pages[p]){n++;const d=S.pageDate[p];if(d){if(!first||d<first)first=d;if(!last||d>last)last=d}}}return {n,total:b-a+1,first,last}}
function juzDone(){let c=0;for(let j=0;j<30;j++){const s=juzStat(j);if(s.n===s.total)c++}return c}
function pagesOn(ds){let n=0;for(const k in S.pageDate)if(S.pageDate[k]===ds&&S.pages[k])n++;return n}
function activeDates(){const set=new Set();for(const d in S.days)if((S.days[d].slots||[]).some(Boolean))set.add(d);for(const k in S.pageDate)if(S.pages[k])set.add(S.pageDate[k]);return set}
function streak(){const a=activeDates();let d=today(),n=0;if(!a.has(iso(d)))d=addDays(d,-1);while(a.has(iso(d))){n++;d=addDays(d,-1)}return n}
function bestStreak(){const a=[...activeDates()].sort();let best=0,cur=0,prev=null;for(const d of a){cur=prev&&diff(parse(prev),parse(d))===1?cur+1:1;best=Math.max(best,cur);prev=d}return best}
function weekKey(d){const w=d.getDay();return w===0||w===6?"we":w===5?"fr":"wd"}

function xpTotal(){

function subtabs(){return `<div class="subtabs only-m">${NAV_MORE().map(n=>`<button data-go="${n[0]}" aria-pressed="${view===n[0]}">${n[1]}</button>`).join("")}</div>`}

function vPlan(){

    let n=0;for(let p=m[0];p<=m[1];p++)if(S.pages[p])n++;const tot=m[1]-m[0]+1,s=monthStart(i),e=addDays(monthStart(i+1),-1);
    const cls=n===tot?"done":i===mi?"cur":"";
    const pill=n===tot?`<span class="pill ok">${L("Выполнено","Орындалды")}</span>`:i===mi?`<span class="pill go">${L("Сейчас","Қазір")}</span>`:i<mi?`<span class="pill warn">${L("Не закрыт","Жабылмаған")}</span>`:n?`<span class="pill">${L("В процессе","Үдерісте")}</span>`:"";
    return `<div class="prow ${cls}"><div class="pm">${n===tot?IC.check:i+1}</div><div class="pmain"><div class="spread"><span class="s">${juzLabel(i)} · ${L(`стр. ${m[0]}–${m[1]}`,`${m[0]}–${m[1]} беттер`)}</span>${pill}</div>
      <div class="r">${fmt(s)} – ${fmt(e)} · ${L(`≈${rate(i)} стр. в день`,`күніне ≈${rate(i)} бет`)}</div><div>${D().plan[i][0]}</div><div class="r">${D().plan[i][1]}</div>${bar(n,tot,n===tot?"var(--accent)":"var(--gold)","thin")}</div></div>`}).join("")}</div></div>`;

function vWeek(){
  const w=new Date().getDay(),col=w===0||w===6?5:w-1,heads=D().wkShort,W=D().week;

  <div class="tablewrap"><table><thead><tr><th>${L("Время","Уақыт")}</th>${heads.map((x,i)=>`<th class="${i===col?"tcol":""}">${x}</th>`).join("")}</tr></thead>
  <tbody>${D().slots.map((s,si)=>`<tr><td>${s}<span>${SLOT_TIME[si]}</span></td>${heads.map((_,ci)=>`<td class="${ci===col?"tcol":""}">${cell(si,ci)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;

  const np=nextPage(),cur=np?juzOf(np):-1;

      <div class="spread"><span class="sub" style="margin:0">${L("Повторений","Қайталау")}</span><span class="counter"><button class="ib" data-rv="${j}" data-d="-1" aria-label="${L("Минус повтор","Қайталауды азайту")}">−</button><b>${S.reviews[j]||0}</b><button class="ib" data-rv="${j}" data-d="1" aria-label="${L("Плюс повтор","Қайталауды қосу")}">+</button></span></div></article>`}).join("")}</div>`;

function vLog(){
  const t=today(),off=(t.getDay()+6)%7,startW=addDays(t,-(7*25)-off);let cells="";
  for(let d=new Date(startW);d<=addDays(t,6-off);d=addDays(d,1)){
    const ds=iso(d);if(d>t){cells+=`<i style="visibility:hidden"></i>`;continue}
    const pg=pagesOn(ds),sl=((S.days[ds]||{}).slots||[]).filter(Boolean).length,sc=pg>=2||sl>=4?3:pg>=1||sl>=2?2:sl>=1?1:0;
    cells+=`<i class="${sc?"a"+sc:""}${ds===iso(t)?" t":""}" title="${fmtY(d)}: ${L(`${pg} стр., ${sl}/5 подходов`,`${pg} бет, ${sl}/5 кезең`)}"></i>`}
  const days=[...new Set(Object.keys(S.days).concat(Object.values(S.pageDate)))].sort().reverse();
  const ent=days.map(ds=>{const r=S.days[ds]||{},f=r.f||{},pg=pagesOn(ds),sl=(r.slots||[]).filter(Boolean).length;
    const note=[f.page&&(L("Новое: ","Жаңа: ")+f.page),f.difficult&&(L("Трудно: ","Қиын: ")+f.difficult),f.dua].filter(Boolean).join(" · ");
    return `<button class="entry" data-open="${ds}"><span class="d">${fmtY(parse(ds))}</span><span class="m">${pg} ${L("стр.","бет")} · ${sl}/5${f.rating?" · "+L("оценка ","баға ")+f.rating:""}</span>${note?`<span class="x">${esc(note)}</span>`:""}</button>`}).join("");
  return subtabs()+`<div class="card"><div class="card-h"><div><h2>${L("Последние полгода","Соңғы жарты жыл")}</h2><div class="sub">${L("Чем ярче клетка, тем больше сделано: новые страницы и подходы.","Ұяшық неғұрлым ашық болса, соғұрлым көп істелген: жаңа беттер мен кезеңдер.")}</div></div></div><div class="heat">${cells}</div>
    <div class="legend" style="margin-top:12px"><span>${L("Меньше","Аз")}</span><i></i><i class="a1"></i><i class="a2"></i><i class="l"></i><span>${L("Больше","Көп")}</span></div></div>
  <div class="card"><div class="card-h"><div><h2>${L("Записи по дням","Күндік жазбалар")}</h2><div class="sub">${L("Нажмите на день, чтобы открыть его лист хафиза.","Хафиз парағын ашу үшін күнді басыңыз.")}</div></div></div><div class="entries">${ent||`<div class="empty">${L("Записей пока нет. Отметьте подходы во вкладке «Сегодня».","Әзірге жазба жоқ. «Бүгін» бөлімінде кезеңдерді белгілеңіз.")}</div>`}</div></div>`;
}

  <div class="card setting"><h2>${L("Сохранение","Сақтау")}</h2><span data-cloud class="pill ${cloudText()[1]}">${cloudText()[0]}</span><div class="sub">${cloudRef?L("Прогресс хранится в вашем аккаунте Claude и одинаков на всех устройствах, где вы открываете эту ссылку.","Прогресс Claude аккаунтыңызда сақталады және осы сілтемені ашатын барлық құрылғыда бірдей."):L("Прогресс хранится только в этом браузере и только по этому адресу. Не открывайте трекер в режиме инкогнито и во встроенных браузерах мессенджеров. Для переноса на другое устройство используйте резервную копию ниже.","Прогресс тек осы браузерде және тек осы мекенжайда сақталады. Трекерді инкогнито режимінде және мессенджерлердің ішкі браузерлерінде ашпаңыз. Басқа құрылғыға көшіру үшін төмендегі сақтық көшірмені қолданыңыз.")}</div></div>
  <div class="card setting"><h2>${L("Дата старта","Старт күні")}</h2><div class="sub">${L("От неё считается план на 12 месяцев и норма страниц в день.","12 айлық жоспар мен күнделікті бет нормасы осы күннен есептеледі.")}</div><input type="date" id="startDate" value="${S.start}"></div>
  <div class="card setting"><h2>${L("Резервная копия","Сақтық көшірме")}</h2><div class="sub">${L("Данные хранятся в этом браузере. Скопируйте код и сохраните в заметках. На другом устройстве вставьте его и нажмите «Восстановить».","Деректер осы браузерде сақталады. Кодты көшіріп, жазбаларға сақтаңыз. Басқа құрылғыда оны қойып, «Қалпына келтіру» түймесін басыңыз.")}</div>
    <textarea class="bk" id="bk" aria-label="${L("Код резервной копии","Сақтық көшірме коды")}" placeholder="${L("Сюда вставляется код резервной копии","Сақтық көшірме коды осында қойылады")}"></textarea>
    <div class="row"><button class="b3 sm" data-act="bkCopy">${L("Скопировать данные","Деректерді көшіру")}</button><button class="b3 ghost sm" data-act="bkLoad">${L("Восстановить","Қалпына келтіру")}</button></div></div>
  <div class="card setting"><h2>${L("Пример и сброс","Үлгі және тазалау")}</h2><div class="row" id="resetZone"><button class="b3 ghost sm" data-act="loadDemo">${L("Показать пример","Үлгіні көрсету")}</button><button class="b3 danger sm" data-act="reset">${L("Сбросить всё","Бәрін тазалау")}</button></div></div>`;

/* ---------- render ---------- */
function render(){
  const sh=document.querySelector("details.sheet");if(sh)sheetOpen=sh.open;
  renderChrome();
  const V={path:vPath,today:vToday,map:vMap,badges:vBadges,plan:vPlan,week:vWeek,juz:vJuz,log:vLog,settings:vSettings}[view];
  $("#main").innerHTML=V();
  if(view==="path"&&!scrolledToCur){scrolledToCur=true;const c=$(".node.cur");if(c){const y=c.getBoundingClientRect().top+scrollY-innerHeight*.45;if(y>200)scrollTo({top:y})}}
  celebrate();
}
function go(v){view=v;popJuz=null;sheetOpen=null;try{history.replaceState(null,"","#"+v)}catch(_){}render();scrollTo({top:0})}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a[data-day]");
  if(popJuz!==null&&!e.target.closest(".pop")&&!(t&&t.dataset.node!==undefined)){popJuz=null;if(!t){render();return}}
  if(!t)return;
  const A=t.dataset.act;
  if(t.dataset.lang){if(S.lang!==t.dataset.lang){S.lang=t.dataset.lang;save();render();toast(L("Язык: русский","Тіл: қазақша"))}return}
  if(t.dataset.go)return go(t.dataset.go==="more"?"plan":t.dataset.go);
  if(t.dataset.node!==undefined){const j=+t.dataset.node;popJuz=popJuz===j?null:j;return render()}
  if(A==="loadDemo")return loadDemo();
  if(A==="clearDemo"){S=blank();save();scrolledToCur=false;render();return toast(L("Бисмиллях! Начинаем ваш хифз","Бисмиллаһ! Хифзыңызды бастаймыз"))}
  if(t.dataset.day!==undefined){e.preventDefault();const n=+t.dataset.day;logDate=n?iso(addDays(parse(logDate),n)):iso(new Date());sheetOpen=null;return render()}
  if(t.dataset.pg){const p=+t.dataset.pg;if(S.pages[p])setPage(p,0);else{setPage(p,1,logDate);toast(L("Страница "+p,p+"-бет")+" · +"+XP.page+" XP")}return render()}
  if(t.dataset.slot!==undefined){const d=day(),i=+t.dataset.slot;d.slots=d.slots||[];d.slots[i]=!d.slots[i];save();if(d.slots[i])toast(d.slots.filter(Boolean).length===5?L("Идеальный день","Мінсіз күн")+" · +"+(XP.slot+XP.perfect)+" XP":"+"+XP.slot+" XP");return render()}
  if(t.dataset.cell){const p=+t.dataset.cell,nx=((S.pages[p]||0)+1)%3;if(!nx)setPage(p,0);else{S.pages[p]=nx;if(!S.pageDate[p])S.pageDate[p]=iso(new Date());save()}return render()}
  const revToast=j=>toast(L("Повтор джуза "+(j+1),(j+1)+"-параны қайталау")+" · +"+XP.review+" XP");
  if(t.dataset.rv!==undefined){const j=+t.dataset.rv,dd=+t.dataset.d,td=iso(new Date());if(dd<0&&!(S.reviews[j]>0))return;S.reviews[j]=(S.reviews[j]||0)+dd;S.revLog[td]=Math.max(0,(S.revLog[td]||0)+dd);save();if(dd>0)revToast(j);return render()}
  if(t.dataset.rev!==undefined){const j=+t.dataset.rev,td=view==="today"?logDate:iso(new Date());S.reviews[j]=(S.reviews[j]||0)+1;S.revLog[td]=(S.revLog[td]||0)+1;save();popJuz=null;render();return revToast(j)}
  if(t.dataset.rt){const d=day();d.f=d.f||{};const v=+t.dataset.rt;d.f.rating=d.f.rating===v?undefined:v;save();if(d.f.rating)toast(L("Оценка дня","Күн бағасы")+" · +"+XP.rating+" XP");return render()}
  const yn=t.closest("[data-yn]");if(yn){const d=day();d.f=d.f||{};const k=yn.dataset.yn,v=t.dataset.v==="1";d.f[k]=d.f[k]===v?undefined:v;save();yn.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",d.f[k]!==undefined&&(b.dataset.v==="1")===d.f[k]));return}
  if(t.dataset.open){logDate=t.dataset.open;return go("today")}
  if(t.id==="mclose"){$("#modal").innerHTML="";return showNext()}
  if(A==="bkCopy"){const txt=JSON.stringify(S),ta=$("#bk");ta.value=txt;const fb=()=>{ta.focus();ta.select();toast(L("Код выделен, скопируйте его","Код белгіленді, оны көшіріңіз"))};
    try{navigator.clipboard.writeText(txt).then(()=>toast(L("Скопировано. Сохраните код в заметках","Көшірілді. Кодты жазбаларға сақтаңыз")),fb)}catch(_){fb()}return}
  if(A==="bkLoad"){try{const o=JSON.parse($("#bk").value);if(!o||typeof o.pages!=="object")throw 0;const lang=S.lang;S=Object.assign(blank(),o);if(S.lang!=="kk"&&S.lang!=="ru")S.lang=lang;save();render();toast(L("Данные восстановлены","Деректер қалпына келтірілді"))}catch(_){toast(L("Код не распознан. Вставьте его целиком","Код танылмады. Оны толық қойыңыз"))}return}
  if(A==="reset"){$("#resetZone").innerHTML=`<span class="sub" style="margin:0">${L("Удалить все отметки без возврата?","Барлық белгіні қайтарымсыз өшіру керек пе?")}</span><button class="b3 danger sm" data-act="resetYes">${L("Да, удалить","Иә, өшіру")}</button><button class="b3 ghost sm" data-act="resetNo">${L("Отмена","Болдырмау")}</button>`;return}
  if(A==="resetNo")return render();
  if(A==="resetYes"){S=blank();save();render();return toast(L("Все данные удалены","Барлық деректер өшірілді"))}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").innerHTML){$("#modal").innerHTML="";showNext()}else if(popJuz!==null){popJuz=null;render()}}});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k)return;const d=day();d.f=d.f||{};d.f[k]=e.target.value;save()});
document.addEventListener("change",e=>{if(e.target.id==="startDate"&&e.target.value){S.start=e.target.value;save();render();toast(L("Дата старта сохранена","Старт күні сақталды"))}});

function loadDemo(){
  const t=today(),start=addDays(t,-44);S=blank();S.demo=true;S.start=iso(start);
  let p=1;
  for(let i=0;i<44;i++){const d=iso(addDays(start,i));if(i%9===6&&i<30)continue;const n=i<14?1:2;for(let k=0;k<n&&p<=72;k++){S.pages[p]=1;S.pageDate[p]=d;p++}
    S.days[d]={slots:[true,true,i%3!==0,true,i%4!==1],f:i%5===0?{page:juzName(juzOf(p-1)+1)+" / "+L("стр. ","бет ")+(p-1),reps:"20",mins:"45",rating:7+(i%3),difficult:i%10===0?L("Переход между аятами 8 и 9","8 және 9-аяттың арасындағы ауысу"):"",audio:true}:{}}}
  [14,15,33,41].forEach(x=>{if(S.pages[x])S.pages[x]=2});
  S.reviews={0:9,1:3,2:1};S.revLog[iso(addDays(t,-1))]=2;
  S.seen={level:levelOf(xpTotal()),badges:badgeList().filter(b=>b.ok).map(b=>b.id)};
  save();logDate=iso(new Date());scrolledToCur=false;go("path");toast(L("Загружен пример за 44 дня","44 күндік үлгі жүктелді"));
}

/* ---------- celebration ---------- */
let queue=[];
function celebrate(){
  const lv=levelOf(xpTotal()),B=badgeList(),got=B.filter(b=>b.ok).map(b=>b.id);
  if(!S.seen){S.seen={level:lv,badges:got};save();return}
  const fresh=got.filter(id=>!S.seen.badges.includes(id));
  if(lv>S.seen.level){const r=rankOf(lv);queue.push({ic:"crown",h:L("Уровень "+lv,lv+"-деңгей"),ar:r[1],t:L("Звание: "+r[0]+". Каждый аят приближает к цели.","Атақ: "+r[0]+". Әр аят мақсатқа жақындатады.")})}
  for(const id of fresh){const b=B.find(x=>x.id===id);queue.push({ic:b.ic,h:b.t,t:L("Новая награда: ","Жаңа марапат: ")+b.d.charAt(0).toLowerCase()+b.d.slice(1)+"."})}
  if(lv!==S.seen.level||fresh.length){S.seen={level:Math.max(lv,S.seen.level),badges:[...new Set(S.seen.badges.concat(got))]};save()}
  if(queue.length&&!$("#modal").innerHTML)showNext();
}
function showNext(){
  const m=queue.shift();if(!m)return;
  $("#modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.h)}"><div class="mbox"><div class="medal">${star()}<span class="ic">${IC[m.ic]}</span></div>${m.ar?`<div class="ar">${m.ar}</div>`:""}<h2>${esc(m.h)}</h2><p>${esc(m.t)}</p><button class="b3 gold wide" id="mclose" style="margin-top:10px">${L("Альхамдулиллях","Әлхамдулиллаһ")}</button></div></div>`;
  $("#mclose").focus();confetti();
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx"),x=c.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),cols=["--accent","--gold","--coral","--sec1","--sec3"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:150},()=>({x:W/2,y:H*.42,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*7+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,s:Math.random()<.4}));
  let n=0;(function f(){x.clearRect(0,0,W,H);for(const p of P){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.a+=.18;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
    if(p.s){x.fillRect(-p.r/2,-p.r/2,p.r,p.r);x.rotate(Math.PI/4);x.fillRect(-p.r/2,-p.r/2,p.r,p.r)}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}
    if(++n<120)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})();
}

render();
initCloud();
})();
